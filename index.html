<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 980px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        
        .left {
            width: 50%;
        }

        .logo {
            color: #1877f2;
            font-size: 46px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .text {
            font-size: 20px;
            line-height: 1.3;
            color: #1c1e21;
        }

       
        .login-box {
            width: 370px;
            background: white;
            padding: 14px;
            border-radius: 7px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        input {
            width: 100%;
            height: 37px;
            margin-bottom: 11px;
            padding: 10px;
            border: 1px solid #dddfe2;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
           
            border-color: #1877f2;
        }

        .login-btn {
            width: 100%;
            height: 37px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #166fe5;
        }

        .forgot {
            display: block;
            margin: 12px 0 14px;
            color: #1877f2;
            text-decoration: none;
            font-size: 12px;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .create-btn {
            background-color: #42b72a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 3px;
        }

        .create-btn:hover {
            background-color: #36a420;
        }

        
        @media (max-width: 800px) {
            .container {
                width: 90%;
                flex-direction: column;
                text-align: center;
                gap: 30px;
            }

            .left {
                width: 100%;
            }

            .login-box {
                width: 100%;
                max-width: 370px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">
            <div class="logo">facebook</div>

            <p class="text">
                Connect with friends and the world<br>
                around you on Facebook.
            </p>
        </div>

       
        <div class="login-box">

            <form>
                <input type="text" placeholder="Email or phone number">

                <input type="password" placeholder="Password">

                <button type="submit" class="login-btn">
                    Login
                </button>
            </form>

            <a href="#" class="forgot">Forgot password?</a>

            <hr>

            <button class="create-btn">
                Create new account
            </button>

        </div>

    </div>
<div>
    <a href="#" > <button>9.2-index.html</button></a>
</div>
</body>
</html>
